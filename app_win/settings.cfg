# Mic2Clip settings (key=value). Secrets stay in .env (GEMINI_API_KEY, GOOGLE_APPLICATION_CREDENTIALS).
# Environment variables override values from this file.

# Global hotkey to show/hide dictation window (keyboard library format)
MIC2CLIP_HOTKEY=alt+q

# Auto-hide dictation window and stop listening after N seconds of silence (0 to disable)
AUTO_HIDE=30

# Gemini model for Improve / Translate
GEMINI_MODEL=gemini-3.5-flash

# Microphone capture
SAMPLE_RATE=16000
CHANNELS=1
